apiVersion: v1
kind: Namespace
metadata:
  name: user-auth-demo
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: user-auth-demo
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: user-auth-demo
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: ccr.ccs.tencentyun.com/279129867/mariadb:10.11
          imagePullPolicy: IfNotPresent
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "root"
            - name: MARIADB_DATABASE
              value: "user_auth_demo"
            - name: MARIADB_USER
              value: "demo"
            - name: MARIADB_PASSWORD
              value: "demo123"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["bash", "-c", "mysqladmin ping -h localhost -uroot -proot"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-data
          emptyDir: {}
      imagePullSecrets:
        - name: tencent-cr
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: user-auth-demo
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: user-auth-demo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: ccr.ccs.tencentyun.com/279129867/redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: tencent-cr

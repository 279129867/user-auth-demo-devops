# 一键起全套：MySQL + Redis + 应用
services:
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_auth_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo123
    ports:
      # 宿主机 3306 被本地 MySQL80 服务占用，宿主侧映射到 3307；
      # 容器间仍走内网 mysql:3306，不影响应用连接
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: demo-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 生产环境务必覆盖此密钥
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: demo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      
  alertmanager:
    image: prom/alertmanager:latest
    container_name: demo-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro


  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: demo-mysqld-exporter
    depends_on:
      - mysql
    environment:
      - DATA_SOURCE_NAME=root:root@(mysql:3306)/
    ports:
      - "9104:9104"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: demo-redis-exporter
    depends_on:
      - redis
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: demo-node-exporter
    ports:
      - "9100:9100"
  

  grafana:
    image: grafana/grafana:latest
    container_name: demo-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      

volumes:
  mysql_data:
  grafana_data:

version: '1.0'
displayName: 自动构建
triggers:
  push:
    branches:
      include:
        - main

stages:
  - stage:
      name: Maven构建
      tasks:
        - task:
            name: 编译打包
            use: shell
            image: maven:3.9-eclipse-temurin-17
            script: |
              mvn clean package -DskipTests -B

  - stage:
      name: 构建并推送镜像
      tasks:
        - task:
            name: 登录并推送
            use: shell
            script: |
              echo $TCR_PASSWORD | docker login ccr.ccs.tencentyun.com -u $TCR_USERNAME --password-stdin
              docker build -t ccr.ccs.tencentyun.com/279129867/user-auth-demo:latest .
              docker push ccr.ccs.tencentyun.com/279129867/user-auth-demo:latest
